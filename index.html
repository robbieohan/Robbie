<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robbie's Recipe Collection</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">&#127859;</span>
        <div class="logo-text">
          <h1>Robbie's Recipe Collection</h1>
          <p class="tagline">Made with love, shared with joy</p>
        </div>
      </div>
    </div>

    <!-- FILTER BAR -->
    <nav class="filter-bar" role="navigation" aria-label="Cuisine filters">
      <div class="filter-inner">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Italian">Italian</button>
        <button class="filter-btn" data-filter="Mexican">Mexican</button>
        <button class="filter-btn" data-filter="Asian">Asian</button>
        <button class="filter-btn" data-filter="American">American</button>
        <button class="filter-btn" data-filter="Mediterranean">Mediterranean</button>
        <button class="filter-btn" data-filter="Indian">Indian</button>
      </div>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="results-info">
      <span id="results-count"></span>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close recipe">&times;</button>
      <div class="modal-image-wrap">
        <img src="" alt="" id="modal-image" class="modal-image" />
        <span class="modal-cuisine-badge" id="modal-cuisine"></span>
      </div>
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-description" id="modal-description"></p>

        <div class="modal-meta">
          <div class="meta-item">
            <span class="meta-label">Prep Time</span>
            <span class="meta-value" id="modal-prep"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Cook Time</span>
            <span class="meta-value" id="modal-cook"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Servings</span>
            <span class="meta-value" id="modal-serves"></span>
          </div>
        </div>

        <div class="modal-section">
          <h3>Ingredients</h3>
          <ul class="ingredients-list" id="modal-ingredients"></ul>
        </div>

        <div class="modal-section">
          <h3>Instructions</h3>
          <ol class="instructions-list" id="modal-instructions"></ol>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Made with <span class="heart">&#10084;</span> for a love of good food</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
